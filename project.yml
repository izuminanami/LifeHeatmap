name: LifeHeatmap
options:
  bundleIdPrefix: com.imuzi37
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: GBVLR8PRV8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LifeHeatmap:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 生活ヒートマップ
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: 歩数・睡眠時間をヒートマップに表示するために、ヘルスケアのデータを読み取ります。
        NSPhotoLibraryUsageDescription: 撮った写真の枚数を日ごとに数えるために、写真ライブラリを読み取ります。写真そのものは表示・送信しません。
        CFBundleURLTypes:
          - CFBundleURLName: com.imuzi37.LifeHeatmap
            CFBundleURLSchemes: [lifeheatmap]
    entitlements:
      path: App/LifeHeatmap.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.imuzi37.LifeHeatmap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imuzi37.LifeHeatmap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: HeatmapWidget
  HeatmapWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 生活ヒートマップ
        NSHealthShareUsageDescription: 歩数・睡眠時間をヒートマップに表示するために、ヘルスケアのデータを読み取ります。
        NSPhotoLibraryUsageDescription: 撮った写真の枚数を日ごとに数えるために、写真ライブラリを読み取ります。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HeatmapWidget.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.imuzi37.LifeHeatmap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imuzi37.LifeHeatmap.HeatmapWidget
        SKIP_INSTALL: YES
  LifeHeatmapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LifeHeatmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WidgetRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RenderTests, Shared, Widget/HeatmapWidgetView.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeHeatmap:
    build:
      targets:
        LifeHeatmap: all
    test:
      targets: [LifeHeatmapTests, WidgetRenderTests]
